# Intraday line refresh for the public slate (refresh_lines.py on czarp-v2).
#
# Scheduled workflows only run from the default branch (main); the pipeline lives on czarp-v2, so this job
# checks out that branch. Branch protection on czarp-v2 is what stops unreviewed code from running here.
#
# Schedule (Christian, t250u), in America/Chicago time:
#   normal day : 10 AM, 1 PM, 4 PM, 7 PM CT
#   light day  : 12 PM and 5 PM CT (fewer than 20 D-I games on today's slate; refresh_lines.LIGHT_DAY_MAX_GAMES)
# Cron is UTC and has no DST, so it fires at every UTC hour that can be one of those CT hours in either
# CST (UTC-6, Nov to mid-March) or CDT (UTC-5, mid-March on). refresh_lines.py decides from the CT clock and
# today's game count whether this hour is a run hour; other firings exit before any network call.
#   CST: 16 (10a) 18 (12p) 19 (1p) 22 (4p) 23 (5p) 01 (7p)     CDT: 15 (10a) 17 (12p) 18 (1p) 21 (4p) 22 (5p) 00 (7p)
# Minute :05, off the top-of-hour rush. GitHub may start a scheduled run a few minutes late, which is fine.
#
# What it writes: new vegas 'current' market_lines rows (only when a line changed) and new projections rows
# (7:15 projections unchanged, edges / skip reasons recomputed). Never picks, never the ledger, never KenPom.
# The Odds API is used only for games ESPN has no line for, under the 'refresh' slot (max 3 paid calls a day,
# part of Christian's 5/day cap across all jobs). Paid refresh calls are claimed in Supabase
# (odds_api_refresh_claims), not a runner cache; this workflow does not use odds_api_usage.json.

name: Intraday line refresh

on:
  schedule:
    - cron: "5 0,1,15-19,21-23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even if this is not a refresh hour (still budget-capped)."
        type: boolean
        default: false
      dry_run:
        description: "Compute and log only: no writes, no Odds API call."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: line-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh lines and edges
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout czarp-v2
        uses: actions/checkout@v4
        with:
          ref: czarp-v2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same pins as the finals sync: czarp-v2's requirements.txt is lower-bound only.
          python -m pip install -r requirements.txt \
            "requests==2.34.2" \
            "pandas==2.3.3" \
            "numpy==2.4.6" \
            "python-dotenv==1.2.4"

      - name: Refresh lines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SERVICE_KEY repo secret."
            exit 1
          fi
          if [ -z "$ODDS_API_KEY" ]; then
            echo "No ODDS_API_KEY secret: ESPN lines only (no Odds API fallback)."
          fi
          ARGS=""
          if [ "$FORCE_INPUT" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python refresh_lines.py $ARGS
